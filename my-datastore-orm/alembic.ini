[DEFAULT]

script_location = alembic

[snowflake-dev]
sqlalchemy.url = snowflake://siddartham/MY_DATASTORE_DEV/INFORMATION_SCHEMA?role=APP_SNOWFLAKE_DEV_MY_DATASTORE_ADMIN&warehouse=MY_WAREHOUSE_PREPROD
version_locations = alembic/versions/snowflake

[snowflake-qa]
sqlalchemy.url = snowflake://siddartham/MY_DATASTORE_QA/INFORMATION_SCHEMA?role=APP_SNOWFLAKE_QA_MY_DATASTORE_ADMIN&warehouse=MY_WAREHOUSE_PREPROD
version_locations = alembic/versions/snowflake

[snowflake-prod]
sqlalchemy.url = snowflake://siddartham/MY_DATASTORE_PROD/INFORMATION_SCHEMA?role=APP_SNOWFLAKE_PROD_SMY_DATASTORE_ADMIN&warehouse=MY_WAREHOUSE_PROD
version_locations = alembic/versions/snowflake

[post_write_hooks]
hooks=black
black.type=console_scripts
black.entrypoint=black
black.options=-l 79


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy][]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
