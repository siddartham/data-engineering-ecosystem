[metadata]
name = my-datastore-etl
version = 0.0.0a0
author_email = reddy.siddartha53@gmail.com
description =
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/siddartham/data-engineering-ecosystem/my-datastore-etl

[options]
python_requires = ~=3.8
include_package_data = True
packages =
	my_datastore_etl
install_requires =
	analytics-etl
; 	my-datastore-model[pyarrow]
	packaging

; [options.extras_require]
; spark =
; 	my-datastore-model[pyspark]
; snowflake =
; 	my-datastore-model[snowflake]
; postgresql =
; 	my-datastore-model[postgresql]
; all =
; 	my-datastore-model[pyspark]
; 	my-datastore-model[snowflake]
; 	my-datastore-model[postgresql]

[options.entry_points]
console_scripts =
	my-datastore-etl = my_datastore_etl.__main__:main

[options.package_data]
* = py.typed
