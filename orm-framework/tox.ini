[tox]
parallel = all
parallel_show_output = True
envlist = isort, black, flake8, mypy, pytest

[testenv]
passenv =
	USER
	HOME
	HUDSON_URL
	CI
	JAVA_HOME
	PYSPARK_SUBMIT_ARGS
	AWS_WEB_IDENTITY_TOKEN_FILE
	AWS_ROLE_ARN
	DOCKER_*
setenv =
	PIP_EXTRA_INDEX_URL =
	SQLALCHEMY_WARN_20 = 1
install_command =
	pip install -c requirements.txt {opts} {packages}
extras =
	all

[testenv:pytest]
deps =
	pytest
	databricks-sdk
	delta-spark
commands_pre =
	orm-framework spark install-snowflake-jdbc-driver
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning

[testenv:black]
deps =
	black
commands =
	black --check .

[testenv:flake8]
deps =
	flake8
commands =
	flake8

[testenv:mypy]
deps =
	mypy
	alembic
	delta-spark
	databricks-sdk
commands =
	mypy --install-types --non-interactive
	mypy
plugins =
	sqlalchemy.ext.mypy.plugin

[testenv:isort]
deps =
	isort
commands =
	isort -c .
