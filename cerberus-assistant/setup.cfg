[metadata]
name = cerberus-assistant
version = 0.0.0
author_email = reddy.siddartha53@gmail.com
description =
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/siddartham/data-engineering-ecosystem/cerberus-assistant

[options]
python_requires = ~=3.8
include_package_data = True
packages =
	cerberus_assistant
install_requires =
	cerberus-python-client~=2.5

[options.entry_points]
console_scripts =
	cerberus-assistant = cerberus_assistant.__main__:main

[options.package_data]
* = py.typed
