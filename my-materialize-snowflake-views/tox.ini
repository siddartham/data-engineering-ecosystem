[tox]
parallel_show_output = True
envlist = black, isort, flake8, mypy, pytest

[testenv]
passenv =
	USER
	HOME
	HUDSON_URL
	CI
	AWS_WEB_IDENTITY_TOKEN_FILE
	AWS_ROLE_ARN
	DOCKER_*
setenv =
	PIP_EXTRA_INDEX_URL =
install_command =
	pip install -c requirements.txt {opts} {packages}

[testenv:pytest]
deps =
	sob
	pytest
commands =
	py.test -s

[testenv:black]
deps =
	black
commands =
	black --check .

[testenv:isort]
deps =
	isort
commands =
	isort -c .

[testenv:flake8]
deps =
	flake8
commands =
	flake8

[testenv:mypy]
deps =
	sob
	mypy
commands =
	mypy --install-types --non-interactive
	mypy
