name: test
on:
  workflow_dispatch:
  pull_request:
    paths:
    - my_materialized_snowflake_views/**
    - pyproject.toml
    - setup.py
    - setup.cfg
    - tests/**
    - requirements.txt
    - tox.ini
    - .github/**
    - Makefile
    - .github/workflows/test.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.8
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    - run: make ci-install
    - run: make test
