[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
target-version = [
    "py38",
    "py39",
    "py310",
    "py311",
]

[tool.isort]
profile = "black"
src_paths = [
    "databricks_jobs",
    "tests",
    "setup.py",
]
line_length = 79
wrap_length = 79
multi_line_output = 3

[tool.databricks-jobs]
host = "community.cloud.databricks.com"
token-cerberus-path = "app/sustainability/sustainability/ServicePrincipal_-community.cloud.databricks.com_App.Sole.sustainability.Developer"
requirements = "requirements.txt"
init_scripts = [
    "/Workspace/Shared/databricks-jobs-test/init.sh",
]

[tool.databricks-jobs.files]
"init.sh" = "/Workspace/Shared/databricks-jobs-test/init.sh"
"requirements.txt" = "/Workspace/Shared/databricks-jobs-test/requirements.txt"
