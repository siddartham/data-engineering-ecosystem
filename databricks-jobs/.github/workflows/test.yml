name: test
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
    - '*'
    paths:
    - databricks_jobs/**
    - setup.py
    - setup.cfg
    - tests/**
    - requirements.txt
    - tox.ini
    - .github/**
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - 3.8
        - 3.9
        - '3.10'
        - '3.11'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    - run: make ci-install
    - run: make test
