[tox]
parallel_show_output = False
envlist = black, isort, flake8, mypy, pytest

[testenv]
passenv =
	USER
	HOME
	JENKINS_URL
	JAVA_HOME
	AWS_WEB_IDENTITY_TOKEN_FILE
	AWS_ROLE_ARN
setenv =
	PIP_EXTRA_INDEX_URL = NONE
	SQLALCHEMY_WARN_20 = 1
install_command =
	pip install -c requirements.txt {opts} {packages}
extras =
	all

[testenv:pytest]
deps =
	pytest
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning

[testenv:black]
deps =
	black
commands =
	black --check .

[testenv:flake8]
deps =
	flake8
commands =
	flake8

[testenv:mypy]
deps =
	mypy
	alembic
commands =
	mypy --install-types --non-interactive
	mypy
plugins =
	sqlalchemy.ext.mypy.plugin

[testenv:isort]
deps =
	isort
commands =
	isort -c .
