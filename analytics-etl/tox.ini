[tox]
parallel_show_output = True
envlist = black, flake8, mypy, isort, pytest-snowflake, pytest-databricks, pytest-s3-spark, pytest-s3-not-spark, pytest-postgresql, pytest-local, pytest-local-not-spark

[testenv]
install_command =
	python3 -m pip install -c requirements.txt {opts} {packages}
passenv =
	HUDSON_URL
	CI
	LOCALSTACK_HOSTNAME
	SPARK_LOCAL_IP
	AWS_WEB_IDENTITY_TOKEN_FILE
	AWS_ROLE_ARN
	DOCKER_*
setenv =
	PIP_EXTRA_INDEX_URL=NONE
	OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
	AIRFLOW_GPL_UNIDECODE=YES

[testenv:pytest-s3-spark]
extras =
      spark
       snowflake
deps =
      my-datastore-etl[snowflake,spark]
      localstack-s3-pyspark
      file-system-client[localstack,s3]
      pyspark
      pytest
commands_pre =
       localstack-s3-pyspark configure-defaults
commands =
       py.test -W error::sqlalchemy.exc.SADeprecationWarning -m spark tests/test_s3.py

[testenv:pytest-local]
extras =
	spark
deps =
	my-datastore-etl[spark]
	file-system-client
	pytest
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning -m spark tests/test_local.py

[testenv:pytest-local-not-spark]
deps =
	my-datastore-etl
	file-system-client
	pytest
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning -m "not spark" tests/test_local.py

[testenv:pytest-snowflake]
extras =
	spark
	snowflake
deps =
	my-datastore-etl[snowflake,spark]
	pytest
commands_pre =
	analytics-orm spark install-snowflake-jdbc-driver
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning tests/test_snowflake.py

[testenv:pytest-databricks]
extras =
	spark
	databricks
deps =
	my-datastore-etl[databricks,spark]
	pytest
commands_pre =
	analytics-orm spark install-databricks-jdbc-driver
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning tests/test_databricks.py

[testenv:pytest-postgresql]
install_command =
	python3 -m pip install {opts} {packages}
extras =
	postgresql
deps =
	my-datastore-etl[postgresql]
	pytest
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning tests/test_postgresql.py

[testenv:pytest-transformer]
deps =
	my-datastore-etl
	pytest
commands =
	py.test -W error::sqlalchemy.exc.SADeprecationWarning tests/test_transformer.py

[testenv:black]
deps =
	black
commands =
	black --check .

[testenv:flake8]
deps =
	flake8
commands =
	flake8

[testenv:mypy]
extras =
	all
deps =
	daves-dev-tools
	my-datastore-etl[all]
	mypy
	pyspark
	pytest
commands =
	mypy --install-types --non-interactive
	mypy

[testenv:isort]
deps =
	isort
commands =
	isort -c .
