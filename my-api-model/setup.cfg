[metadata]
name = my-api-model
version = 0.0.0
author_email = reddy.siddartha53@gmail.com
description = My API Object Relational Model
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/siddartham/data-engineering-ecosystem/my-api-model

[options]
python_requires = ~=3.8
packages =
	my_api_model
	my_api_model.dialects
include_package_data = True
install_requires =
	analytics-orm
	sqlalchemy<3,>1.3

[options.extras_require]
postgresql =
	analytics-orm[postgresql]
all =
	analytics-orm[postgresql]

[options.entry_points]
console_scripts =
	my-api-model = my_api_model.__main__:main

[options.package_data]
* = py.typed
