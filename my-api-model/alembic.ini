[DEFAULT]
script_location = alembic

[postgresql-dev]
sqlalchemy.url = postgresql:///sustainability_dev
version_locations = alembic/versions/postgresql

[postgresql-qa]
sqlalchemy.url = postgresql:///sustainability_qa
version_locations = alembic/versions/postgresql

[postgresql-prod]
sqlalchemy.url = postgresql:///sustainability_prod
version_locations = alembic/versions/postgresql

[post_write_hooks]
hooks=black
black.type=console_scripts
black.entrypoint=black
black.options=-l 79

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
