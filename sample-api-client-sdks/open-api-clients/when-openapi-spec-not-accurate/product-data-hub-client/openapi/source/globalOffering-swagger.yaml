swagger: '2.0'
info:
  title: Line Management Global Offering Service
  description: This is the API for the Line Management Global Offering entity and should be the way to get or search Global Offering data.
  version: 1.4.0
host: linemanagement.api-product.pes-prod.nike.com
schemes:
  - https
basePath: /v1
produces:
  - application/json
paths:

# Entity Methods
  /lineManagement/data/productOfferings/global/{objectId}:
    get:
      summary: Global Offering Data
      description: How you get a single global offering.
      parameters:
        - name: objectId
          in: path
          description: A single Id of the object (in this case Line Management Product Offering ID)
          required: true
          type: integer
        - name: _dataunits
          in: query
          description: 'The data units that would be desired, default returns just core data'
          required: false
          type: array
          items:
            type: string
          collectionFormat: csv
          enum:
            - poCore
            - poRestricted
            - poMarketingType
            - poMarketing
            - poDevelopment
            - poResources
            - poSample
            - poStatus
            - poAudit
            - pCore
            - pInitialSeason
            - pSize
            - pColor
            - pTeam
            - pConfidentiality
            - pLifeCycle
            - pClassification
            - pStatus
            - pAudit
            - sCore
            - sInitialSeason
            - sDescription
            - sClassification
            - sHarmonized
            - sPhysicalDescriptor
            - sSize
            - sMeasurement
            - sLicense
            - sTeam
            - sTechnology
            - sGroup
            - sStatus
            - sAudit
            - moCore
            - moGroup
            - moGlobalPrice
            - moLineEvolution
            - moConfidentiality
            - moResources
            - moSustainabilityIndexScore
            - moForecast
            - moTier
            - moConsumer
            - moMarketing
            - moSponsor
            - moStatus
            - moAudit
            - mCore
            - mInitialSeason
            - mGroup
            - mClassification
            - mAudit
        - name: X-B3-TraceId
          in: header
          type: string
          required: false
          description: 'A UUID that will uniquely identify a reqest for tracking purposes, if not passed one will be assigned'
        - name: x-api-key
          in: header
          type: string
          required: true
          description: The api key that will identify an application with the AWS API Gateway and is used for tracking and throttling
      tags:
        - Global Offering
      responses:
        '200':
          description: Returns response object which contains global offering core with requested data units
          schema:
            $ref: '#/definitions/globalOfferingResponse'
          headers:
            X-B3-TraceId:
              description: A UUID that will uniquely identify a reqest for tracking purposes
              type: string
            cache-control:
              description: Will indicate rules around caching of the content returned.
              type: string
            expires:
              description: Will indicate a time when this data should be expired in the cache, though cache-control takes precedence
              type: string
              format: date-time
        '400':
          description: If you ask for a data unit that is does not exist
          schema:
            $ref: '#/definitions/_error'
          headers:
            X-B3-TraceId:
              description: A UUID that will uniquely identify a reqest for tracking purposes
              type: string
        '401':
          description: You are not authorized to access this resource
          schema:
            $ref: '#/definitions/_error'
          headers:
            X-B3-TraceId:
              description: A UUID that will uniquely identify a reqest for tracking purposes
              type: string
        '403':
          description: Access Denied to Object
          schema:
            $ref: '#/definitions/_error'
          headers:
            X-B3-TraceId:
              description: A UUID that will uniquely identify a reqest for tracking purposes
              type: string
        '404':
          description: The object you have requested is not found
          schema:
            $ref: '#/definitions/_error'
        '500':
          description: There has been an internal server error.
        '503':
          description: "The service is overloaded, please contact support"
      security:
        - nike_auth: [read]

