  /lineManagement/search/products/selectedImageIdentifier:
    get:
      summary: Global Offering Search
      description: How you search against all fields contained within the Selected Image entity
      parameters:
        - name: count
          in: query
          description: "Number of entries the API should attempt to fetch, default is 10"
          required: false
          type: integer
        - name: offset
          in: query
          description: "Offset of the entries the API should attempt to fetch, default is 0"
          required: false
          type: integer
        - name: X-B3-TraceId
          in: header
          type: string
          required: false
          description: 'A UUID that will uniquely identify a reqest for tracking purposes, if not passed one will be assigned'
        - name: x-api-key
          in: header
          type: string
          required: true
          description: The api key that will identify an application with the AWS API Gateway and is used for tracking and throttling
        - name: q
          in: query
          description: 'This parameter is how you pass free text search, if any string is passed here it will be searched as free text'
          required: false
          type: string
  # Enum for search
  # by Start and End Time - for Changes within a time frame
        - name: changeStartTime
          in: query
          required: false
          type: string
          format: date-time
          collectionFormat: csv
          description: 'This is the Start Date Time (in ISO 8601 format) parameter to search for any Global Product Offering object changes within a specified time frame'
        - name: changeEndTime
          in: query
          required: false
          type: string
          format: date-time
          collectionFormat: csv
          description: 'This is the End Date Time (in ISO 8601 format) parameter to search for any Global Product Offering object changes within a specified time frame'
        - name: colorwayIdentifier
          in: query
          required: false
          type: array
          items:
            type: integer
          collectionFormat: csv
        - name: productRepresentationId
          in: query
          required: false
          type: array
          items:
            type: integer
          collectionFormat: csv
        - name: productLineManagerImageDisplayOrderNumber
          in: query
          required: false
          type: array
          items:
            type: integer
          collectionFormat: csv
      tags:
        - Selected Product Image
        - Search
      responses:
        '200':
          description: Returns response object which contains links to Selected Product Image endpoint
          schema:
            $ref: '#/definitions/searchResponse'
