swagger: "2.0"
info:
  title: Material Management Service
  description: This is the API for the Material Management and Material Procurement entities and should be the way to get or search various Material data.
  version: 3.1.0
host: materialmanagement.api-product.pes-prod.nike.com
schemes:
  - https
basePath: /v3
produces:
  - application/json
paths:
  # Entity Methods
  /materialManagement/data/materials/{objectId}:
    get:
      summary: Materials Data
      description: How you get a single materials.
      parameters:
        - name: objectId
          in: path
          description: A single Id of the object (in this case Materials)
          required: true
          type: integer
        - name: _dataunits
