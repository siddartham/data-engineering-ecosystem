            - matComponentCordlockToggle
            - matComponentCounter
            - matComponentElastic
            - matComponentDrawcordAglet
            - matComponentHook
            - matComponentHookLoop
            - matComponentLabel
            - matComponentLace
            - matComponentMagnet
            - matComponentPadding
            - matComponentPinBadge
            - matComponentShankPlates
            - matComponentRing
            - matComponentThread
            - matComponentZipper
            - matComponentZipperPullAttachment
            - matCushioning
            - matInsulationAndPadding
            - matLabelAndPackagingProperties
            - matPackaging
            - matPackagingCard
            - matPackagingCartonInner
            - matPackagingFastener
            - matPackagingHanger
            - matPackagingHangtag
            - matPackagingPartition
            - matPackagingShoebag
            - matPackagingShoeForm
            - matPackagingSticker
            - matPackagingTissue
        - $ref: "#/parameters/traceParam"
        - $ref: "#/parameters/apiKeyParam"
      tags:
        - Materials
      responses:
        "200":
          description: Returns response object which contains materials core with requested data units
          schema:
            $ref: "#/definitions/materialsResponse"
          headers:
            X-B3-TraceId:
              description: A UUID that will uniquely identify a reqest for tracking purposes
              type: string
            cache-control:
              description: Will indicate rules around caching of the content returned.
              type: string
            expires:
              description: Will indicate a time when this data should be expired in the cache, though cache-control takes precedence
              type: string
              format: date-time
        "400":
          description: If you ask for a data unit that is does not exist
          schema:
            $ref: "#/definitions/_error"
          headers:
            X-B3-TraceId:
              description: A UUID that will uniquely identify a reqest for tracking purposes
              type: string
        "401":
          description: You are not authorized to access this resource
