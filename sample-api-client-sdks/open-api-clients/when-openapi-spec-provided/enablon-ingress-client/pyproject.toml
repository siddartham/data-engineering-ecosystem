[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
target-version = [
    "py38",
    "py39",
    "py310",
    "py311",
]
extend-exclude = ".*/model.py|.*/client.py"

[tool.isort]
profile = "black"
src_paths = [
    "enablon_egress_client",
    "tests",
    "setup.py",
    "scripts",
]
line_length = 79
wrap_length = 79
multi_line_output = 3
