name: CI/CD
on:
  push:
    branches:
    - main
    paths:
    - airtable_client/**
    - setup.py
    - setup.cfg
    - tests/**
    - requirements.txt
    - tox.ini
    - .github/**
  pull_request:
    branches:
    - '*'
    paths:
    - airtable_client/**
    - setup.py
    - setup.cfg
    - tests/**
    - requirements.txt
    - tox.ini
    - .github/**
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - 3.8
        - 3.9
        - '3.10'
        - 3.11
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    - run: make ci-install && make test
  distribute:
    if: github.ref == 'refs/heads/main'
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
    - run: make ci-install && make distribute
