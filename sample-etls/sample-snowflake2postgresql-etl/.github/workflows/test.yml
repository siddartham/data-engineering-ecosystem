name: test
on:
  workflow_dispatch:
  pull_request:
    paths:
    - sample_snowflake2postgres_etl
    - pyproject.toml
    - setup.py
    - setup.cfg
    - tests/**
    - requirements.txt
    - tox.ini
    - .github/**
    - Makefile
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.8
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - run: |
          sudo apt-get update
          sudo apt-get install libpq-dev libsasl2-dev -y
      - run: make ci-install
      - run: make test
