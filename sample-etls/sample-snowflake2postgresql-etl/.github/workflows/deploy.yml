name: deploy
on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - pyproject.toml
    - setup.py
    - setup.cfg
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.8
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - run: make ci-install
      - run: make requirements
      - run: make distribute
      - name: Deploy to DEV + QA
        run: venv/bin/dev-tools airflow deploy dev qa
      - name: Run in QA
        run: venv/bin/dev-tools airflow run qa
      - name: Deploy to PROD
        run: venv/bin/dev-tools airflow deploy prod
