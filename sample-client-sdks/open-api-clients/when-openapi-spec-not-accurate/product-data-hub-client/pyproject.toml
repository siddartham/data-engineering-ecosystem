[build-system]
requires = [
    "setuptools",
    "wheel",
    "pip",
    "cython",
]
build-backend = "setuptools.build_meta"

[tool.black]
extend-exclude = "/product_data_hub_client/(?!abc)[^/]+/([a-z_]+_)?(model|client)\\.py"
line-length = 79
target-version = [
    "py38",
    "py39",
    "py310",
    "py311",
]

[tool.isort]
profile = "black"
src_paths = [
    "product_data_hub_client",
    "tests",
    "scripts",
    "setup.py",
]
line_length = 79
wrap_length = 79
multi_line_output = 3
extend_skip_glob = [
    "product_data_hub_client/[!abc]**/model.py",
    "product_data_hub_client/[!abc]**/client.py",
    "product_data_hub_client/**/*_model.py",
    "product_data_hub_client/**/*_client.py",
]
