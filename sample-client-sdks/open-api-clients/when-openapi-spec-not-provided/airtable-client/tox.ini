[tox]
parallel_show_output = True
requires =
	pip
envlist = pytest, black, flake8, mypy

[testenv]
passenv =
	USER
	HOME
	HUDSON_URL
	CI
	AWS_WEB_IDENTITY_TOKEN_FILE
	AWS_ROLE_ARN
	DOCKER_*
setenv =
	PIP_EXTRA_INDEX_URL =
install_command =
	pip install -c requirements.txt {opts} {packages}
extras =
	all

[testenv:pytest]
deps =
	pytest
	pyspark
commands =
	py.test --doctest-modules

[testenv:black]
deps =
	black
commands =
	black --check .

[testenv:flake8]
deps =
	flake8
commands =
	flake8

[testenv:mypy]
deps =
	mypy
	pyspark
commands =
	mypy --install-types --non-interactive
	mypy
